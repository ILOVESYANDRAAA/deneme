[package]
name = "sugarcad"
version = "0.1.0"
description = "VS Code gibi hafif, eklenti destekli 3D CAD uygulaması"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sugarcad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Küçük ve hızlı ikili dosya
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
