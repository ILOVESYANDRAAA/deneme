name: Test ve Derleme

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Her çalıştırma yeni bir sürüm numarası alır; otomatik güncelleme bunu karşılaştırır.
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-sonuclari
          path: test-results/

  release-prep:
    name: Sürüm taslağı
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: decide
        name: Yayın yapılacak mı?
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          # Elle tetikleme (Actions → Run workflow) de yayın yapar; PR'lar yapmaz.
          IS_RELEASE_BRANCH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'claude/dazzling-tesla-iurb6a') }}
        run: |
          if [ "$IS_RELEASE_BRANCH" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [ "$HAS_KEY" != "true" ]; then
              echo "::notice::TAURI_SIGNING_PRIVATE_KEY secret'ı yok; otomatik güncelleme yayını atlandı, sadece artifact üretilecek."
            fi
          fi
      - id: create
        name: Taslak Release oluştur
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="v$APP_VERSION" \
            -f target_commitish="${{ github.sha }}" \
            -f name="sugarCAD v$APP_VERSION" \
            -f body="Otomatik derleme: ${{ github.sha }}" \
            -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Masaüstü (${{ matrix.platform }})
    needs: release-prep
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux bağımlılıkları
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Sürüm numarası
        shell: bash
        run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - name: Rust testleri
        if: matrix.platform == 'linux'
        working-directory: src-tauri
        run: cargo test
      - name: Derle, imzala ve Release'e yükle
        if: needs.release-prep.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.release-prep.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Derle (imzasız)
        if: needs.release-prep.outputs.publish != 'true'
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: sugarcad-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Sürümü yayınla
    needs: [release-prep, desktop]
    if: needs.release-prep.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Üç platform da yüklendikten sonra taslak yayına alınır; uygulamalar bu sürümü görür.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.release-prep.outputs.release_id }}" \
            -F draft=false -f make_latest=true --jq '.html_url'
